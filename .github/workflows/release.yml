name: Release

# Version shape: v0.<minor>.<build>
#   - minor   moved by hand in Directory.Build.props, when a new chapter starts.
#   - build   this workflow's run number. Never set by hand — it is what identifies a release.
#
# The workflow always creates its own tag, after the checks pass. There is deliberately no
# tag-push trigger: GitHub's documentation does not define whether a `paths` filter applies to tag
# pushes, and a release pipeline must not rest on an undefined interaction whose failure mode is
# silence. Releasing something other than the tip of `main` is done with a manual run against that
# ref, which produces a properly numbered tag anyway.

on:
  # Trigger 1: a squash-merge landed on `main`. Under this branching model `main` receives nothing
  # but releases, so a push to it *is* the release decision — already taken when the pull request
  # was merged. Asking for a second confirmation in the Actions tab would confirm the same thing
  # twice.
  #
  # `paths` is an allow-list, not an ignore-list, because documentation is an open set and sources
  # are a closed one: `CHANGELOGS/`, `docs/adr`, `docs/plans`, `docs/ideas` and `agents/` all
  # appeared over time, and an ignore-list would have to be extended each time — which nobody
  # remembers. The source roots below are the ones `agents/structure.md` documents; adding a new one
  # means adding it here too.
  #
  # Not listed, deliberately: `tests/` and `demo/` (never reach SPLA.zip — a test-only change is not
  # a product change, and ci.yml has already run it), `.github/` (changing this workflow does not
  # change the product; test it with a manual run), and everything textual.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'skills/**'
      - 'Directory.Build.props'
      - 'SPLA.slnx'
      - 'PublishAll.ps1'
      - 'PublishAll.cmd'
      - 'CopySkills.ps1'
      - 'EnsureNodeJs.ps1'
  # Trigger 2: a manual run from the Actions tab, against any ref. Ignores the path filter above, so
  # it is also the escape hatch for when a release is wanted and the filter did not fire.
  workflow_dispatch: {}

# The GITHUB_TOKEN needs write access to push a tag and create a release.
permissions:
  contents: write

# Only one release job at a time, so an automatic run and a manual one cannot publish twice from
# the same commit.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      # Full history: the tag operations below need it.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Work out the version this run will produce, but do not create the tag yet — the checks
      # below have to pass first. A tag must never point at a build that failed.
      - name: Resolve version
        shell: pwsh
        run: |
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<VersionMinor>(\d+)</VersionMinor>') {
            Write-Host 'ERROR: could not read VersionMinor from Directory.Build.props' -ForegroundColor Red
            exit 1
          }
          $minor = $Matches[1]
          $build = '${{ github.run_number }}'
          "TAG_NAME=v0.$minor.$build" >> $env:GITHUB_ENV
          "VERSION_BUILD=$build" >> $env:GITHUB_ENV
          Write-Host "This run produces v0.$minor.$build"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      # Node.js — the solution build shells out to npm. Cache is keyed on every lockfile in the
      # repo (there are six npm projects).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # The gate: the same checks as ci.yml, run again against the exact commit being released. A
      # manual run can target any ref, including one ci.yml never saw.
      #
      # `dotnet build` also type-checks and bundles the web trees (see the note in ci.yml), so only
      # vitest needs its own line. PublishAll.ps1 later does its own clean build, deliberately: it
      # must produce the same output whether or not anything ran before it.
      - name: Run tests
        shell: pwsh
        run: |
          npm --prefix web ci
          dotnet restore SPLA.slnx
          dotnet build SPLA.slnx -c Release --no-restore --nologo
          dotnet test tests/SPLA.Tests/SPLA.Tests.csproj -c Release --no-build --nologo
          npm --prefix web run test

      # Assemble the release body from CHANGELOGS/. Each working file carries an explanatory
      # preamble about how the file itself works; the publishable content is everything after the
      # first `---` line, so that convention is what the split below relies on.
      #
      # The summary is included only if it is current. `current-summary.md` opens with a
      # `<!-- covers: YYYY-MM-DD -->` marker naming the newest log date it accounts for; if the log
      # has moved past it, the summary describes a state that no longer exists. A stale summary is
      # worse than none — it is confidently wrong — so it is dropped rather than published.
      - name: Assemble release notes
        shell: pwsh
        run: |
          function Get-Body([string] $path) {
            $lines = Get-Content $path
            $sep = ($lines | Select-String -Pattern '^---\s*$' | Select-Object -First 1).LineNumber
            if (-not $sep) { return ($lines -join "`n").Trim() }
            return (($lines[$sep..($lines.Count - 1)]) -join "`n").Trim()
          }

          $parts = @()
          $summaryPath = 'CHANGELOGS/current-summary.md'
          $logPath     = 'CHANGELOGS/current-log.md'
          $listPath    = 'CHANGELOGS/current-list.md'

          # Freshness: compare the summary's marker with the newest date heading in the log.
          $covers = $null
          if (Test-Path $summaryPath) {
            $m = Select-String -Path $summaryPath -Pattern '<!--\s*covers:\s*(\d{4}-\d{2}-\d{2})\s*-->' |
                 Select-Object -First 1
            if ($m) { $covers = $m.Matches[0].Groups[1].Value }
          }
          $lastLog = $null
          if (Test-Path $logPath) {
            $dates = Select-String -Path $logPath -Pattern '^##\s+(\d{4}-\d{2}-\d{2})\s*$' |
                     ForEach-Object { $_.Matches[0].Groups[1].Value }
            if ($dates) { $lastLog = ($dates | Sort-Object | Select-Object -Last 1) }
          }

          if ($covers -and (-not $lastLog -or $covers -ge $lastLog)) {
            $parts += Get-Body $summaryPath
          }
          elseif (Test-Path $summaryPath) {
            Write-Host "WARNING: summary covers $covers but the log reaches $lastLog — omitting it." -ForegroundColor Yellow
            $parts += "_The written summary was out of date for this release and has been omitted._"
          }

          if (Test-Path $listPath) {
            $parts += "## Changes`n`n" + (Get-Body $listPath)
          }

          $logUrl = "${{ github.server_url }}/${{ github.repository }}/blob/$env:TAG_NAME/CHANGELOGS/current-log.md"
          $parts += "Full detailed log for this release: [``CHANGELOGS/current-log.md``]($logUrl)"

          ($parts -join "`n`n") | Set-Content release-notes.md -Encoding utf8
          Write-Host "Release notes: $((Get-Content release-notes.md).Count) line(s)."

      # Only now, with the checks green, does the tag become real.
      - name: Create and push tag
        id: create_tag
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag $env:TAG_NAME
          git push origin $env:TAG_NAME

      # Build the solution, publish every plugin and both apps, and zip the result. The build number
      # is passed in so every binary in the ZIP reports the version of the tag it belongs to.
      - name: Publish all (build, plugins, apps, zip)
        shell: pwsh
        run: ./PublishAll.ps1 -VersionBuild $env:VERSION_BUILD

      # Keep a copy of the ZIP as a workflow artifact, separate from the GitHub release below.
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SPLA-${{ env.TAG_NAME }}
          path: .publish/zip/SPLA.zip

      # Publish the release. body_path is what the earlier step assembled from CHANGELOGS/;
      # generate_release_notes appends GitHub's own pull-request summary and changelog link after it.
      - name: Create GitHub release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: release-notes.md
          files: .publish/zip/SPLA.zip
          generate_release_notes: true

      # A tag this workflow created must never outlive the build it names. Guarded on the tag step
      # having actually succeeded, since a failure during the checks happens before any tag exists.
      - name: Remove tag if publish failed
        if: failure() && steps.create_tag.outcome == 'success'
        shell: pwsh
        run: git push origin --delete $env:TAG_NAME
