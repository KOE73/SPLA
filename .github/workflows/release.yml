name: Release

# Version shape: v0.<minor>.<build>
#   - minor   moved by hand in Directory.Build.props, when a new chapter starts.
#   - build   also moved by hand in Directory.Build.props, in the release commit — see below.
#
# This workflow decides nothing about the release. Every decision — the version, the frozen
# changelog, the release body — is made locally, by hand, in one commit before the push that
# triggers this run (see AGENTS.md, "CI and releases"). This workflow's only job is to check that
# decision is actually there, run the same tests as ci.yml against it, and publish exactly what
# was prepared. It fails rather than improvising if anything is missing.
#
# This replaces an earlier version that computed the build number from its own run count and
# assembled the release body from CHANGELOGS/current-*.md at publish time. Both meant the release
# nobody could reproduce locally and nobody had actually reviewed before it went out — see
# ADR_20260818-3_deterministic-release-commit, which records what that produced.

on:
  # Any push to `main` is the release decision — main receives nothing else under this branching
  # model (see AGENTS.md). No `paths` filter: whether this run has anything to publish is decided
  # by the "Verify release commit" step below, not by which files changed.
  push:
    branches: [main]
  # Manual run from the Actions tab, against any ref — the escape hatch for re-running a release
  # that failed for an infrastructure reason after its commit already exists.
  workflow_dispatch: {}

# The GITHUB_TOKEN needs write access to push a tag and create a release.
permissions:
  contents: write

# Only one release job at a time, so an automatic run and a manual one cannot publish twice from
# the same commit.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      # Full history: the tag operations below need it, and so does checking whether the version's
      # tag already exists.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Read the version verbatim from Directory.Build.props — this run does not compute any part
      # of it. Fails if the file doesn't parse; that's a broken commit, not a missing release.
      - name: Read version
        shell: pwsh
        run: |
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<VersionMajor>(\d+)</VersionMajor>' -or
              $props -notmatch '<VersionMinor>(\d+)</VersionMinor>' -or
              $props -notmatch '<VersionBuild Condition="[^"]*">(\d+)</VersionBuild>') {
            Write-Host 'ERROR: could not read Major/Minor/Build from Directory.Build.props' -ForegroundColor Red
            exit 1
          }
          $major = [regex]::Match($props, '<VersionMajor>(\d+)</VersionMajor>').Groups[1].Value
          $minor = [regex]::Match($props, '<VersionMinor>(\d+)</VersionMinor>').Groups[1].Value
          $build = [regex]::Match($props, '<VersionBuild Condition="[^"]*">(\d+)</VersionBuild>').Groups[1].Value
          "TAG_NAME=v$major.$minor.$build" >> $env:GITHUB_ENV
          "VERSION_BUILD=$build" >> $env:GITHUB_ENV
          Write-Host "Committed version: v$major.$minor.$build"

      # The gate: is the release commit actually complete? Every check here mirrors a row in
      # AGENTS.md's "CI and releases" table. Nothing downstream may compensate for a failure here —
      # a missing file means the release was not prepared, not that this workflow should prepare it.
      - name: Verify release commit
        shell: pwsh
        run: |
          $fail = $false

          if (git rev-parse "$env:TAG_NAME" -- 2>$null) {
            Write-Host "ERROR: tag $env:TAG_NAME already exists — Directory.Build.props was not bumped." -ForegroundColor Red
            $fail = $true
          }

          $frozen = "CHANGELOGS/$env:TAG_NAME.md"
          if (-not (Test-Path $frozen)) {
            Write-Host "ERROR: $frozen is missing — the changelog was not frozen for this release." -ForegroundColor Red
            $fail = $true
          }

          $notes = "CHANGELOGS/$env:TAG_NAME-notes.md"
          if (-not (Test-Path $notes)) {
            Write-Host "ERROR: $notes is missing — no release body was written." -ForegroundColor Red
            $fail = $true
          }

          foreach ($f in 'current-log.md', 'current-list.md', 'current-summary.md') {
            $path = "CHANGELOGS/$f"
            $lines = Get-Content $path
            $sep = ($lines | Select-String -Pattern '^---\s*$' | Select-Object -First 1).LineNumber
            $body = if ($sep) { ($lines[$sep..($lines.Count - 1)] -join "`n").Trim() } else { '' }
            if ($body) {
              Write-Host "ERROR: $path still has content after the release — it was not emptied." -ForegroundColor Red
              $fail = $true
            }
          }

          if ($fail) { exit 1 }
          Write-Host "Release commit for $env:TAG_NAME is complete."
          # The git rev-parse probe above deliberately fails (tag not found yet) on every normal
          # run and leaves that in $LASTEXITCODE; nothing after it is a native command that would
          # overwrite it. pwsh falls back to $LASTEXITCODE as its own exit code when a script ends
          # without an explicit exit, so a step that just proved everything is fine still reported
          # itself failed. Say so explicitly instead of trusting whatever leaked through.
          exit 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      # Node.js — the solution build shells out to npm. Cache is keyed on every lockfile in the
      # repo (there are six npm projects).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # The same checks as ci.yml, run again against the exact commit being released. A manual run
      # can target any ref, including one ci.yml never saw.
      #
      # `dotnet build` also type-checks and bundles the web trees (see the note in ci.yml), so only
      # vitest needs its own line. PublishAll.ps1 later does its own clean build, deliberately: it
      # must produce the same output whether or not anything ran before it.
      - name: Run tests
        shell: pwsh
        run: |
          npm --prefix web ci
          dotnet restore SPLA.slnx
          dotnet build SPLA.slnx -c Release --no-restore --nologo
          dotnet test tests/SPLA.Tests/SPLA.Tests.csproj -c Release --no-build --nologo
          npm --prefix web run test

      # Only now, with the checks green, does the tag become real — on the commit this run is
      # actually building from.
      - name: Create and push tag
        id: create_tag
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag $env:TAG_NAME
          git push origin $env:TAG_NAME

      # Build the solution, publish every plugin and both apps, and zip the result. The build number
      # is passed in so every binary in the ZIP reports the version it was committed as.
      - name: Publish all (build, plugins, apps, zip)
        shell: pwsh
        run: ./PublishAll.ps1 -VersionBuild $env:VERSION_BUILD

      # Keep a copy of the ZIP as a workflow artifact, separate from the GitHub release below.
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SPLA-${{ env.TAG_NAME }}
          path: .publish/zip/SPLA.zip

      # Publish the release. body_path is the notes file written by hand in the release commit,
      # attached verbatim. generate_release_notes is off — GitHub's auto-generated notes list merged
      # pull requests, and under this branching model there is exactly one per release (the squash),
      # so its output is a single uninformative line stapled onto a body that already said everything.
      - name: Create GitHub release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: CHANGELOGS/${{ env.TAG_NAME }}-notes.md
          files: .publish/zip/SPLA.zip
          generate_release_notes: false

      # A tag this workflow created must never outlive the build it names. Guarded on the tag step
      # having actually succeeded, since a failure during the checks happens before any tag exists.
      - name: Remove tag if publish failed
        if: failure() && steps.create_tag.outcome == 'success'
        shell: pwsh
        run: git push origin --delete $env:TAG_NAME
