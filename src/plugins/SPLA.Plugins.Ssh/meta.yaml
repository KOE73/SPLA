id: ssh
version: 0.1.0
type: dll
entry_point: SPLA.Plugins.Ssh.dll
web_settings_entry: web/dist/settings.js
default_prompt: |
  SSH tools run commands on remote hosts. Sessions are live and human-visible: the operator watches
  the commands and output appear in a terminal panel and can type into the same shell.

  Tools:
    ssh_list_hosts    — list configured SSH hosts (name, address, user, auth type). Never shows passwords.
    ssh_run           — run ONE command on a host and return its output (stateless, one-shot).
    ssh_sessions      — list open live sessions with their ids (host#N), who opened them, viewer count.
    ssh_session_exec  — run a command in a PERSISTENT live shell session the human watches; shell state
                        (cd, env) carries over. Target an exact session with 'session' (host#N), or a
                        host with 'host'. A command still running at the timeout is NOT killed: you get
                        the output so far (status running) and continue with ssh_session_wait.
    ssh_session_wait  — keep waiting on a running command (or watch for new output). Returns only the
                        NEW output since your last look; nothing is lost between calls. Ends on
                        completion, on an 'until' regex match, on disconnect, or on timeout (call again).
    ssh_session_send  — send raw keys (answer a prompt, q to leave a pager, ctrl_c to interrupt).
                        ctrl_c is the way to un-stick a session: it interrupts, verifies the shell
                        came back, and frees the session for the next exec.
    ssh_session_close — end a live session (host#N) for everyone.

  File transfer (SFTP — never through the shell):
    sftp_ls           — list files/directories on a remote host, with sizes and times.
    sftp_download     — copy a remote file or directory into the project.
    sftp_upload       — write one file onto a remote host (writable hosts only).
    tar_list          — list what is inside a container in the project.
    tar_read          — read one file out of a container.
    tar_write         — add, replace or remove one file inside a container.

  Moving files is ALWAYS sftp_*. Never move file content through the shell — no scp, no
  `curl -o`, no `base64 | cat`. sftp_* needs no quoting, works regardless of which commands the
  host allows, and reports what failed per file instead of as parsed text.
  Remote paths have no shell behind them: `~` is resolved for you, but `*` and `$VAR` are not
  expanded — pass a directory plus an 'include' pattern instead of a wildcard path.

  Containers (.tar):
  - A path ending in `.tar` is a CONTAINER FILE: one file on the local disk holding a Linux
    directory tree. `sftp_download` decides by that name alone — 'staging/prod.tar' creates a
    container, 'staging/prod' writes ordinary files and folders. There is no format parameter.
  - A container keeps a Linux tree as it was. Names Windows cannot store survive inside it
    (`a:b`, `README` next to `readme`, `aux`), and symlinks and permission bits are recorded.
    Written into a plain folder those same files fail the whole download instead — so when taking
    a real config tree off a server, name the destination `.tar`.
  - Recorded permissions and links are INFORMATION about the source host, not something restored.
    On the new host decide what is right and set it yourself; the old owner and mode rarely apply.
  - A container stays one object and does not mix into the project's files. The ordinary system_*
    file tools do NOT look inside it — use tar_list / tar_read / tar_write.
  - Cost: tar cannot change a file in place, so every tar_write rewrites the whole container.
    At configuration sizes this is nothing; do not loop it over hundreds of entries.
  - Use a plain folder instead when it is a couple of files you want to read and edit with the
    ordinary file tools.

  Moving configuration between servers is analysis, not copying: read what the old host has,
  judge what the new one actually needs, then write the adapted file with sftp_upload. Do not
  push a downloaded file back verbatim unless you have checked it fits the target.

  Sessions (host#N):
  - Several parallel sessions to one host are normal and identified as host#1, host#2, … Use
    ssh_sessions to see them, then pass 'session' to ssh_session_exec to run in a specific one — e.g.
    watch `top` in ioBroker#1 while working in ioBroker#2.
  - Prefer a session over ssh_run for multi-step work (cd/env persist). The human sees every command;
    do not treat it as a private channel.

  Long-running commands (apt upgrade, builds, reboots):
  - Give exec a reasonable timeout_seconds; if it returns "STILL RUNNING", loop on ssh_session_wait —
    each call is cheap and returns only new output. If wait returns nothing repeatedly, the command is
    probably asking a question: check the last output and answer with ssh_session_send.
  - `reboot` drops the connection — exec/wait return status "disconnected" immediately. That is normal:
    open a new session after a pause and retry until the host is back (wait's 'until' regex helps).
  - For apt/dpkg prefer DEBIAN_FRONTEND=noninteractive to avoid full-screen dialogs entirely.

  Interactive programs (top, htop, less, an install asking Y/n):
  - Pagers are already disabled in every session (PAGER/SYSTEMD_PAGER/GIT_PAGER/MANPAGER=cat), so
    systemctl status, journalctl, git log and man return normally. Do not add --no-pager.
  - To sample top-like screens pass interrupt_on_timeout=true with a short timeout_seconds (snapshot,
    then Ctrl+C recovers the shell).
  - Answer prompts or interrupt with ssh_session_send (ctrl_c, q, enter, or literal text).

  A session that will not accept commands ("a command is still running here"):
  - One command at a time per session — while one is pending, exec is REFUSED. Retrying the same call
    is always wrong: it fails identically. Do one of the following instead.
  - No output arriving? Send ctrl_c. It is not a blind keystroke: it interrupts, checks that the shell
    came back, frees the session, and tells you which happened. After "INTERRUPTED" or "ALREADY
    FINISHED" go straight to ssh_session_exec — do not call ssh_session_wait to "confirm".
  - "CTRL+C DID NOT FREE THE SHELL" means a full-screen program owns the terminal (pager, top, vim,
    installer); Ctrl+C does not quit those. Send q (pager/top), or esc then ':q!' with enter=true (vim).
    Sending ctrl_c a second time achieves nothing.
  - Still stuck: ssh_session_exec with force=true abandons the command and runs anyway, or work in a
    second session (pass a different 'session'/'host'), or ssh_session_close and open a new one.

  Write access (per host):
  - By default the read-only guard blocks mutating commands (rm, mv, dd, kill, package installs,
    redirection, sudo, …). A host with `allow_write: true` in its settings lifts the guard entirely —
    apt, systemctl restart, editing files are then allowed. Only hosts the operator opted in accept
    writes; on a read-only host, report the refusal and pick a read-only alternative, do not try to
    bypass the guard.
  - The same opt-in governs sftp_upload. File transfer runs over SFTP and never reaches the shell,
    so the read-only guard cannot see it: taking files OFF a host is always allowed, putting files
    ON one is refused unless that host has allow_write.

  Configuration & secrets:
  - Hosts are defined in project config under plugins.ssh.settings.hosts. Each host names an address
    and a credential REFERENCE — `credential: <entry>` pointing at a secret-store entry whose fields
    (user, password, or private_key+passphrase) supply the login — never a literal password. Older
    single-value pointers (password: secret:KEY or env:VAR) also work.
  - Credentials live in the secret store, not in config or chat. If a connection fails for missing
    credentials, tell the user to store the secret — `spla secret set <entry> --field password --user`
    (one field per call; the scope flag --user/--project/--shared is required and has no default) or
    the Settings → Secrets page. Do not ask them to paste the password into the chat.

  Usage:
  - ssh_run takes a single command; there is no persistent shell, so each call is independent (cd does
    not carry over). Pass an absolute path instead of relying on a working directory.
  - Omit 'host' to use the configured default host.
